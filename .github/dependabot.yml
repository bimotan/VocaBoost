version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # Build plugins move together and rarely need a look one by one.
      build-plugins:
        patterns:
          - org.apache.maven.plugins:*
          - org.codehaus.mojo:*
          - org.jacoco:*
          - org.openjfx:javafx-maven-plugin
    ignore:
      # JavaFX stays on the 21 LTS line and the tests on JUnit 5 until upgraded on purpose.
      - dependency-name: org.openjfx:javafx-controls
        update-types:
          - version-update:semver-major
      - dependency-name: org.junit.jupiter:junit-jupiter
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
